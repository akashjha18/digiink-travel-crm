name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend validate, build, and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
      DATABASE_URL: mysql://ci:ci@127.0.0.1:3306/digiink_crm_ci
      JWT_SECRET: ci-only-access-secret-not-used-for-real-users
      JWT_REFRESH_SECRET: ci-only-refresh-secret-not-used-for-real-users
      ENCRYPTION_KEY: ci-only-encryption-key-not-used-for-real-users
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma validate --schema=prisma/schema.prisma
      - run: npm run prisma:generate
      - run: npm run build
      - run: npm test -- --passWithNoTests

  frontend:
    name: Frontend typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
